name: Arduino Build

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/arduino-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/arduino-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: Configure ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit ADS1X15"
          arduino-cli lib install "TFT_eSPI"

      - name: Configure TFT_eSPI
        run: |
          # Kopier vores User_Setup.h til TFT_eSPI-biblioteket
          TFT_DIR=$(find ~/.arduino15 -type d -name "TFT_eSPI" | head -n 1)
          cp firmware/User_Setup.h "$TFT_DIR/User_Setup.h"
          echo "TFT_eSPI dir: $TFT_DIR"

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=no_ota \
            firmware/Multimeter_Firmware.ino